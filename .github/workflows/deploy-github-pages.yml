# Publishes Storybook to the gh-pages branch (avoids deploy-pages 404 when Actions Pages API is unavailable).
#
# One-time repo setup:
#   Settings → Pages → Build and deployment → Source: Deploy from a branch
#   Branch: gh-pages  /  (root)
#
# Live URL: https://<user>.github.io/<repo-name>/
name: Deploy Storybook to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        env:
          STORYBOOK_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build-storybook

      - name: Verify build output
        run: test -f storybook-static/index.html

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./storybook-static
          publish_branch: gh-pages
          enable_jekyll: false
